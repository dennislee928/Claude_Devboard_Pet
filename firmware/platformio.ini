[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI is configured entirely from here (no User_Setup.h edits).
; Wiring (ESP32 DevKit V1 -> ST7789 240x240 IPS):
;   3V3->VCC  GND->GND  GPIO18->SCL  GPIO23->SDA  GPIO4->RES  GPIO2->DC  GPIO5->CS  3V3->BLK
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
